<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>배경색 변경</title>
</head>
<body>
    <h3>일요일은 pink, 다른 요일은 gold 배경</h3>
    <hr>
    <script>
        let current = new Date(); // 현재 날짜/시간 객체 생성

        // 1. 배경색 설정: getDay()가 0이면 일요일
        if(current.getDay() === 0) {
            document.body.style.backgroundColor = "pink";
        } else {
            document.body.style.backgroundColor = "gold";
        }

        // 본문에 요일 표시를 위해 [] 생성 
        const week = ["일요일", "월요일", "화요일", "수요일", "목요일", "금요일", "토요일"];


        // current.getDate()는 '일(날짜)'을, current.getDay()는 '요일(숫자)'을 가져옵니다.
        document.write("오늘 : " + current.getDate() + "일, " + week[current.getDay()]);
    </script>
</body>
</html>

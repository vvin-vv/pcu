<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>정수 역순 출력</title>
</head>
<body>
    <h3>정수 5개 입력받아 역순으로 출력</h3>
    <hr>
    입력된 수의 배열
    <br>
    <script>
        let plots = []; // 숫자를 담을 배열 생성하기

        // 5번 반복해서 숫자를 입력받음
        for(let i = 0; i < 5; i++) //i를 0으로 초기화 후 5번 반복할 수 있는 함수 

        { //사용자에게 값을 물어보고, 그 값을 숫자로 바꿔서, 배열의 특정 칸에 쌓는 함수
            let input = prompt((i + 1) + "번째 정수를 입력하세요", 0);
            plots[i] = parseInt(input); // 입력받은 문자열을 숫자로 바꿔 배열에 저장
        }

        // 입력된 순서대로 출력 함수
        for(let i = 0; i < plots.length; i++)
         {
            document.write(plots[i] + " ");
        }
    </script>

    <hr>
    역순으로 재정렬된 배열
    <br>
    <script>
        // 3. 배열을 역순으로 뒤집기
        plots.reverse();

        // 4. 역순으로 출력
        for(let i = 0; i < plots.length; i++) {
            document.write(plots[i] + " ");
        }
    </script>
</body>
</html>
